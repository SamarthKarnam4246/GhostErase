[project]
name = "ghosterase-backend"
version = "0.1.0"
description = "GhostErase backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "sqlalchemy==2.0.38",
  "alembic==1.14.1",
  "pydantic==2.12.5",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.20",
  "chromadb==1.5.9",
  "neatlogs==1.4.26",
  "mcp==2.3.0",
  "keyring==25.7.0",
  "jsonschema==4.26.0",
  "httpx2==2.13.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
